name: Bug report
description: Something does not work with MoofPort
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: MoofPort version
      description: "For example: 1.0"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and RAM
      placeholder: "Mac Classic, 4 MB"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System version and Finder mode
      placeholder: "System 6.0.8, Finder or MultiFinder"
    validations:
      required: true
  - type: input
    id: bluescsi
    attributes:
      label: BlueSCSI board and firmware version
      placeholder: "BlueSCSI v2 Pico 2W, v2026.08.17"
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network software
      placeholder: "MacTCP 2.1, EtherTalk (AppleShare), MoofTCP, ..."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the program you were using and what you did.
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: MoofStat output
      description: Run MoofStat right after the problem and paste (or attach) the MoofStat-<name>.out file.
      render: text
