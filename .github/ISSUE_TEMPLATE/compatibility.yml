name: Compatibility report
description: Program X works (or does not) with MoofPort
labels: [compatibility]
body:
  - type: input
    id: program
    attributes:
      label: Program and version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Works, Works with problems, Does not work]
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Mac, System version, network software and BlueSCSI firmware
  - type: textarea
    id: notes
    attributes:
      label: Notes
